[alias]
xtask = "run -p xtask --release --"
release = "run -p xtask --release -- release"
android = "run -p xtask --release -- android"
ios = "run -p xtask --release -- ios"
ios-release = "run -p xtask --release -- ios-release"
gen-pot = "run -p xtask --release -- gen-pot"
[target.x86_64-pc-windows-msvc]
rustflags = ["-C", "target-feature=+crt-static"]
[target.aarch64-pc-windows-msvc]
rustflags = ["-C", "target-feature=+crt-static"]
[env]
# wxWidgets master rather than its last release, for accessibility fixes that have not shipped in one. The commit is part of the path because wxdragon-sys only rebuilds wxWidgets when WXWIDGETS_DIR changes, not what is in it. `cargo xtask wxwidgets` fetches it (`cargo release` does so itself), and Renovate moves it.
# renovate: datasource=git-refs depName=https://github.com/wxWidgets/wxWidgets branch=master
WXWIDGETS_DIR = { value = "target/wxWidgets-ac4cbd0c09399c6b2975a676b9ee00299a3f9937", relative = true }
