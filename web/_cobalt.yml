site:
  title: Paperback
  description: Paperback is a fast, fully accessible ebook and document reader for Windows, macOS, Linux, iOS and Android.
  base_url: https://paperback.dev
  data:
    # The header carries the four pages a visitor came for. Everything else lives in the footer,
    # so the top of every page is not a wall of nine links.
    nav:
      - [Home, "/"]
      - [Downloads, "/downloads"]
      - [Documentation, "/readme.html"]
      - [Translations, "/translations"]
    footer_nav:
      - [Source code, "https://github.com/trypsynth/paperback"]
      - [Sponsor on GitHub, "https://github.com/sponsors/trypsynth"]
      - [Donate with PayPal, "https://paypal.me/tygillespie05"]
      - [Privacy Policy, "/privacy"]
      - [Licenses, "/licenses"]
