[package]
name = "xtask"
version = "0.1.0"
edition = "2024"

[dependencies]
flate2 = "1.1.9"
patois-build = "0.1.6"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tar = "0.4.46"
ureq = { version = "3.4.0", features = ["json"] }
walkdir = "2.5.0"
zip = { version = "8.6.0", default-features = false, features = ["deflate"] }

[lints]
workspace = true
