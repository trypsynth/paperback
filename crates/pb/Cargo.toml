[package]
name = "pb"
description = "Command-line tool to convert documents to text or HTML using Paperback's parsers"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
anyhow = { workspace = true }
clap = { version = "4.6.7", features = ["derive"] }
glob = "0.3.4"
native-ocr = "0.2.1"
paperback-core = { path = "../paperback-core", features = ["fetch"] }
rpassword = "7.5.4"
tempfile = "3.27.0"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Globalization", "Win32_System_Console"] }

[lints]
workspace = true
