[package]
name = "pb"
description = "Command-line tool to convert documents to text or HTML using Paperback's parsers"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
anyhow = { workspace = true }
clap = { version = "4.6.7", features = ["derive"] }
# Already in the lock file as a build-time dependency of bindgen; this makes it a runtime one, so
# `pb *.pdf` reads the same on Windows as it does in a shell that expands the pattern itself.
glob = "0.3.4"
# The OCR engine itself, for --ocr-image-pages. Core renders the pages; recognizing them is the
# engine's job, and the desktop crate depends on this the same way rather than through core.
native-ocr = "0.1.0"
paperback-core = { path = "../paperback-core" }
rpassword = "7.5.4"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

[lints]
workspace = true
