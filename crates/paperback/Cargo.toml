[package]
name = "paperback"
description = "An accessible, light-weight, fast ebook and document reader"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[package.metadata.patois]
translatable = true

[dependencies]
anyhow = { workspace = true }
base64 = { workspace = true }
bitflags = { workspace = true }
dunce = "1.0.5"
# Decodes the embedded application icon in `ui::icon`; already in the tree via paperback-core.
image = { version = "0.25.10", default-features = false, features = ["png"] }
live-region = "0.3.3"
# Inflates the embedded Help pages; already in the tree via flate2 and patois.
miniz_oxide = "0.9.1"
native-ocr = "0.2.1"
paperback-core = { path = "../paperback-core", features = ["fetch"] }
paperback-formats = { path = "../paperback-formats" }
patois = { version = "0.2.4", features = ["ui"] }
# Recording and dithering are off, since neither is used and both pull in dependencies; the symphonia extras cover DAISY formats rodio's defaults leave out.
rodio = { version = "0.22.2", default-features = false, features = [
	"playback", "tracing", "flac", "mp3", "mp4", "vorbis", "wav",
	"symphonia-adpcm", "symphonia-aiff", "symphonia-alac", "symphonia-mp2",
] }
# Changes playback speed without shifting pitch, which rodio's own `Player::set_speed` does.
rodio-wsola = "0.2.0"
tracing = "0.1.44"
tracing-appender = "0.2.5"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
ship-shape = "0.5.0"
tempfile = "3.27.0"
toml = { workspace = true }
wx-utils = { version = "0.4.4", features = ["shortcuts"] }
# Default features off: Paperback never prints, decodes its own icon, finds with Rust regex and uses system icons, and a release build can't act on asserts.
wxdragon = { version = "0.9.24", default-features = false, features = ["webview"] }
zip = { version = "9.1.3", default-features = false, features = ["deflate"] }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62.2", features = ["Win32_UI_Accessibility", "Win32_System_Com", "Win32_UI_WindowsAndMessaging", "Win32_Foundation", "Win32_System_Ole", "Win32_System_Variant", "Win32_UI_Controls_RichEdit", "Win32_Graphics_Gdi", "Win32_Security", "Win32_Storage_FileSystem", "Win32_System_IO", "Win32_System_LibraryLoader", "Win32_System_Pipes", "Win32_UI_Input", "Win32_UI_Input_KeyboardAndMouse", "Win32_System_Threading", "Win32_UI_Shell"] }

[target.'cfg(target_os = "macos")'.dependencies]
block = "0.1.6"
objc = "0.2.7"

[build-dependencies]
paperback-formats = { path = "../paperback-formats" }
patois-build = "0.1.17"
shipfitter = { version = "0.2.4", features = ["docs", "windows-resources"] }

[dev-dependencies]
rstest = { workspace = true }

[target.'cfg(windows)'.dev-dependencies]
uiautomation = "0.25.1"
windows-core = "0.62.2"

[lints]
workspace = true

# AppKit requires the main thread; Rust's default test harness uses worker threads.
[[test]]
name = "macos_line_navigation"
harness = false

[[test]]
name = "macos_menu_shortcuts"
harness = false

# wxWidgets runs its windows on the main thread, which the default test harness does not use.
[[test]]
name = "windows_rtf_window_append"
harness = false

[[test]]
name = "windows_paragraph_styles"
harness = false
