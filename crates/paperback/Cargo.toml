[package]
name = "paperback"
description = "An accessible, light-weight, fast ebook and document reader"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[package.metadata.patois]
translatable = true

[dependencies]
anyhow = { workspace = true }
base64 = { workspace = true }
bitflags = { workspace = true }
dunce = "1.0.5"
homeport = "0.1.0"
image = { workspace = true, features = ["png"] }
live-region = "0.3.3"
miniz_oxide = "0.9.1"
native-ocr = { workspace = true }
paperback-core = { workspace = true, features = ["fetch"] }
paperback-formats = { workspace = true }
patois = { workspace = true, features = ["ui"] }
rodio = { version = "0.22.2", default-features = false, features = ["playback", "tracing", "flac", "mp3", "mp4", "vorbis", "wav", "symphonia-adpcm", "symphonia-aiff", "symphonia-alac", "symphonia-mp2"] }
rodio-wsola = "0.2.0"
ship-shape = "0.5.0"
tempfile = { workspace = true }
toml = { workspace = true }
tracing = { workspace = true }
tracing-appender = "0.2.5"
tracing-subscriber = { workspace = true }
wx-utils = { version = "0.4.4", features = ["global-hotkeys", "shortcuts"] }
wxdragon = { version = "0.9.24", default-features = false, features = ["webview"] }
zip = { workspace = true }

[target.'cfg(target_os = "macos")'.dependencies]
block = "0.1.6"
objc = "0.2.7"

[target.'cfg(windows)'.dependencies]
windows = { workspace = true, features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_Security", "Win32_Storage_FileSystem", "Win32_System_Com", "Win32_System_IO", "Win32_System_LibraryLoader", "Win32_System_Ole", "Win32_System_Pipes", "Win32_System_Threading", "Win32_System_Variant", "Win32_UI_Accessibility", "Win32_UI_Controls_RichEdit", "Win32_UI_Input", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }

[build-dependencies]
paperback-formats = { workspace = true }
patois-build = { workspace = true }
shipfitter = { workspace = true, features = ["docs", "windows-resources"] }

[dev-dependencies]
rstest = { workspace = true }

[target.'cfg(windows)'.dev-dependencies]
uiautomation = "0.25.1"
windows-core = "0.62.2"

[lints]
workspace = true

# AppKit and wxWidgets need the main thread, which the default test harness doesn't use.
[[test]]
name = "macos_line_navigation"
harness = false

[[test]]
name = "macos_menu_shortcuts"
harness = false

[[test]]
name = "windows_rtf_window_append"
harness = false

[[test]]
name = "windows_paragraph_styles"
harness = false
