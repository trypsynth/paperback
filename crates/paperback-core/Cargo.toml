[package]
name = "paperback-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Core document parsing and reading logic for Paperback"

[package.metadata.patois]
translatable = true

[lib]
name = "paperback_core"
path = "src/lib.rs"
# Mobile builds pass --crate-type to cargo rustc, so desktop doesn't link an unused FFI library.
crate-type = ["rlib"]

[[bin]]
name = "uniffi-bindgen"
path = "src/bin/uniffi-bindgen.rs"
required-features = ["uniffi"]

[features]
fetch = ["dep:ureq"]
uniffi = ["dep:uniffi"]

[dependencies]
anyhow = { workspace = true }
base64 = { workspace = true }
bitflags = { workspace = true }
cfb = { git = "https://github.com/trypsynth/rust-cfb", branch = "permissive-repairs" }
chardetng = "1.0.0"
ego-tree = "0.11.1"
encoding_rs = "0.8.44"
flate2 = "1.1.11"
# Without memmap, the first PDF needing an unembedded font read every installed font whole, which is 334 MB on one Windows machine.
fontdb = { version = "0.24.0", default-features = false, features = ["fs", "memmap"] }
hayro = { git = "https://github.com/trypsynth/hayro", branch = "paperback" }
hayro-interpret = { git = "https://github.com/trypsynth/hayro", branch = "paperback" }
hayro-syntax = { git = "https://github.com/trypsynth/hayro", branch = "paperback" }
icu_normalizer = "2.4.0"
icu_properties = { version = "2.4.0", features = ["unicode_bidi"] }
image = { workspace = true, features = ["jpeg", "png", "gif", "webp", "bmp"] }
key-chord = { version = "0.2.2", features = ["serde"] }
libchm = "0.3.1"
libhlp = "0.3.0"
# Upstream main plus the back-translation fixes BRF and PEF books need, until they are merged (liblouis/louis-rs#44 to #51).
louis-rs = { git = "https://github.com/trypsynth/louis-rs", branch = "paperback" }
lofty = "0.25.5"
math-core = "0.9.0"
mathcat = { version = "0.7.7", features = ["include-zip"] }
memchr = "2.8.3"
mp4ameta = "0.13.0"
odf-crypto = { version = "0.1.0-rc.18", features = ["crypto-ops"] }
office-crypto = "0.4.0"
paperback-formats = { workspace = true }
patois = { workspace = true }
percent-encoding = "2.3.2"
pulldown-cmark = { version = "0.13.6", default-features = false, features = ["html"] }
rayon = { workspace = true }
regex = "1.13.1"
roman = "0.2.2"
roxmltree = "0.21.2"
rtf-parser = "0.4.3"
rustc-hash = "2.1.3"
scraper = "0.29.0"
serde = { version = "1.0.229", default-features = false, features = ["derive", "std"] }
serde_json = { workspace = true }
sha1 = "0.11.0"
skrifa = "0.46.2"
smallvec = "1.16.5"
thiserror = "2.0.21"
toml = { workspace = true }
tracing = { workspace = true }
unicode-bidi = "0.3.18"
uniffi = { version = "0.32.2", features = ["cli"], optional = true }
ureq = { version = "3.5.1", default-features = false, features = ["rustls"], optional = true }
web_atoms = "0.3.0"
zip = { workspace = true }

[build-dependencies]
flate2 = "1.1.11"
shipfitter = { workspace = true }
uniffi = { version = "0.32.2", features = ["build"], optional = true }

[dev-dependencies]
rstest = { workspace = true }
zip = { workspace = true, features = ["aes-crypto"] }

[target.'cfg(windows)'.dev-dependencies]
windows = { workspace = true, features = ["Win32_Foundation", "Win32_Security", "Win32_System_JobObjects", "Win32_System_Threading"] }

[lints]
workspace = true
