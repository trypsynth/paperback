[package]
name = "paperback-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Core document parsing and reading logic for Paperback"

[package.metadata.patois]
translatable = true

[lib]
name = "paperback_core"
path = "src/lib.rs"
# Mobile builds pass --crate-type to cargo rustc, so desktop doesn't link an unused FFI library.
crate-type = ["rlib"]

[dependencies]
anyhow = { workspace = true }
base64 = { workspace = true }
bitflags = { workspace = true }
cfb = { git = "https://github.com/trypsynth/rust-cfb", branch = "permissive-repairs" }
chardetng = "1.0.0"
ego-tree = "0.11.1"
flate2 = "1.1.10"
fontdb = { version = "0.24.0", default-features = false, features = ["fs"] }
hayro = { git = "https://github.com/trypsynth/hayro", branch = "paperback" }
hayro-interpret = { git = "https://github.com/trypsynth/hayro", branch = "paperback" }
hayro-syntax = { git = "https://github.com/trypsynth/hayro", branch = "paperback" }
key-chord = { version = "0.2.2", features = ["serde"] }
encoding_rs = "0.8.42"
icu_normalizer = "2.4.0"
icu_properties = { version = "2.4.0", features = ["unicode_bidi"] }
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png", "gif", "webp", "bmp"] }
libchm = "0.3.0"
libhlp = "0.2.0"
lofty = "0.25.5"
memchr = "2.8.3"
mp4ameta = "0.13.0"
odf-crypto = { version = "0.1.0-rc.15", features = ["crypto-ops"] }
office-crypto = "0.4.0"
paperback-formats = { path = "../paperback-formats" }
patois = "0.2.4"
percent-encoding = "2.3.2"
pulldown-cmark = { version = "0.13.5", default-features = false, features = ["html"] }
rayon = "1.12.0"
regex = "1.13.1"
roman = "0.2.1"
roxmltree = "0.21.2"
rtf-parser = "0.4.3"
scraper = "0.29.0"
web_atoms = "0.3.0"
serde = { version = "1.0.229", default-features = false, features = ["derive", "std"] }
serde_json = "1.0.154"
sha1 = "0.11.0"
thiserror = "2.0.21"
toml = { workspace = true }
tracing = "0.1.44"
unicode-bidi = "0.3.18"
uniffi = { version = "0.32.2", features = ["cli"], optional = true }
ureq = { version = "3.5.0", default-features = false, features = ["rustls"], optional = true }
zip = { version = "9.1.3", default-features = false, features = ["deflate"] }
mathcat = { version = "0.7.7", features = ["include-zip"] }
math-core = "0.9.0"

[build-dependencies]
shipfitter = "0.2.4"
uniffi = { version = "0.32.2", features = ["build"], optional = true }

[dev-dependencies]
rstest = { workspace = true }
zip = { version = "9.1.3", default-features = false, features = ["deflate", "aes-crypto"] }

[target.'cfg(windows)'.dev-dependencies]
windows = { version = "0.62.2", features = ["Win32_Foundation", "Win32_Security", "Win32_System_JobObjects", "Win32_System_Threading"] }

[features]
fetch = ["dep:ureq"]
uniffi = ["dep:uniffi"]

[[bin]]
name = "uniffi-bindgen"
path = "src/bin/uniffi-bindgen.rs"
required-features = ["uniffi"]

[lints]
workspace = true
