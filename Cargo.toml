[workspace]
members = ["crates/paperback", "crates/paperback-core", "crates/paperback-formats", "crates/pb", "crates/xtask"]
resolver = "2"

[workspace.package]
version = "1.0.0"
edition = "2024"
rust-version = "1.91.1"
license = "MIT"
repository = "https://github.com/trypsynth/paperback"

[workspace.dependencies]
anyhow = "1.0.104"
base64 = "0.23.1"
bitflags = "2.13.2"
image = { version = "0.25.10", default-features = false }
native-ocr = "0.2.1"
paperback-core = { path = "crates/paperback-core" }
paperback-formats = { path = "crates/paperback-formats" }
patois = "0.2.4"
patois-build = "0.1.17"
rstest = "0.28.0"
serde_json = "1.0.154"
shipfitter = "0.2.4"
tempfile = "3.27.0"
toml = "1.1.8"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
windows = "0.62.2"
zip = { version = "9.2.0", default-features = false, features = ["deflate"] }

[workspace.lints.rust]
# objc's msg_send! checks a cargo-clippy feature no crate defines.
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(feature, values("cargo-clippy"))'] }

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
assert_is_empty = "allow"
cast_precision_loss = "allow"
items_after_statements = "allow"
missing_const_for_fn = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
must_use_candidate = "allow"
option_if_let_else = "allow"
# Conflicts with rustc's unreachable_pub, so one of the two always fires.
redundant_pub_crate = "allow"
significant_drop_tightening = "allow"
similar_names = "allow"
struct_excessive_bools = "allow"
too_long_first_doc_paragraph = "allow"
too_many_lines = "allow"

[profile.release]
strip = true
opt-level = "z"
lto = true
panic = "abort"
codegen-units = 1
