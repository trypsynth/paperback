[workspace]
members = ["crates/paperback", "crates/paperback-core", "crates/paperback-formats", "crates/pb", "crates/xtask"]
resolver = "2"

[workspace.package]
version = "1.0.0"
edition = "2024"
rust-version = "1.91.1"
license = "MIT"
repository = "https://github.com/trypsynth/paperback"

# Deps shared by two or more crates in this workspace.
[workspace.dependencies]
anyhow = "1.0.104"
base64 = "0.23.1"
bitflags = "2.13.2"
rstest = "0.28.0"
toml = "1.1.8"

# Lint policy for every crate in the workspace; each member opts in with `[lints] workspace = true`.
# CI runs clippy with -D warnings, so every lint here fails the build. The allows further down are the pedantic and nursery lints we've decided not to enforce, each with its reason.
[workspace.lints.rust]
# `objc`'s `msg_send!` macro (used by the desktop crate on macOS) expands to a
# `cfg(feature = "cargo-clippy")` check. No crate here defines that feature, so the compiler
# would warn about it; macros from crates written before this check existed need it suppressed.
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(feature, values("cargo-clippy"))'] }

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
# Paperback ships as an application, not a published library, so there's no downstream caller to
# write `# Panics`/`# Errors` sections for; they'd be write-only documentation.
missing_panics_doc = "allow"
missing_errors_doc = "allow"
# Format parsers are long by nature. Splitting a header walk into arbitrary chunks to satisfy a
# line count makes it harder to follow, not easier.
too_many_lines = "allow"
# Options and config structs legitimately carry a lot of independent flags.
struct_excessive_bools = "allow"
# Formatting preferences that fight how this code is already written, with no correctness angle.
items_after_statements = "allow"
too_long_first_doc_paragraph = "allow"
similar_names = "allow"
# Would put an attribute on nearly every getter in an application with no outside callers.
must_use_candidate = "allow"
# Marking functions const only because they could be adds churn and buys nothing here.
missing_const_for_fn = "allow"
# Conflicts with rustc's own unreachable_pub advice, so one of the two always fires.
redundant_pub_crate = "allow"
# Rewrites a plain if let/else into map_or_else closures, which reads worse.
option_if_let_else = "allow"
# Guesses at where to drop a lock and is often wrong about it.
significant_drop_tightening = "allow"
# Its fix is `assert_eq!(x, [] as [T; 0])`, which is harder to read than `assert!(x.is_empty())`.
assert_is_empty = "allow"
# Counts turned into ratios and percentages stay far below where a float stops holding whole numbers.
cast_precision_loss = "allow"

[profile.release]
strip = true
opt-level = "z"
lto = true
panic = "abort"
codegen-units = 1
