[workspace]
members = ["crates/paperback", "crates/paperback-core", "crates/paperback-formats", "crates/pb", "crates/xtask"]
resolver = "2"

[workspace.package]
version = "1.1.0"
edition = "2024"
rust-version = "1.91.1"
license = "MIT"
repository = "https://github.com/trypsynth/paperback"

[workspace.dependencies]
anyhow = "1.0.104"
base64 = "0.23.1"
bitflags = "2.13.2"
image = { version = "0.25.10", default-features = false }
native-ocr = "0.2.1"
paperback-core = { path = "crates/paperback-core" }
paperback-formats = { path = "crates/paperback-formats" }
patois = "0.3.2"
patois-build = "0.1.19"
rstest = "0.28.0"
serde_json = "1.0.154"
shipfitter = "0.2.4"
tempfile = "3.27.0"
toml = "1.2.1"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
windows = "0.62.2"
windows-core = "0.62.2"
zip = { version = "9.5.0", default-features = false, features = ["deflate"] }

[workspace.lints.rust]
# objc's msg_send! checks a cargo-clippy feature no crate defines.
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(feature, values("cargo-clippy"))'] }

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
assert_is_empty = "allow"
cast_precision_loss = "allow"
items_after_statements = "allow"
missing_const_for_fn = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
must_use_candidate = "allow"
option_if_let_else = "allow"
# Conflicts with rustc's unreachable_pub, so one of the two always fires.
redundant_pub_crate = "allow"
significant_drop_tightening = "allow"
similar_names = "allow"
struct_excessive_bools = "allow"
too_long_first_doc_paragraph = "allow"
too_many_lines = "allow"

[profile.release]
strip = true
opt-level = "z"
lto = true
panic = "abort"
codegen-units = 1

# These are where reading and converting a document spends its time; size stays the goal for the GUI toolkit and everything else.
[profile.release.package.paperback-core]
opt-level = 3

[profile.release.package.paperback-formats]
opt-level = 3

[profile.release.package.memchr]
opt-level = 3

[profile.release.package.aho-corasick]
opt-level = 3

[profile.release.package.regex]
opt-level = 3

[profile.release.package.regex-automata]
opt-level = 3

[profile.release.package.regex-syntax]
opt-level = 3

[profile.release.package.roxmltree]
opt-level = 3

[profile.release.package.quick-xml]
opt-level = 3

[profile.release.package.html5ever]
opt-level = 3

[profile.release.package.markup5ever]
opt-level = 3

[profile.release.package.scraper]
opt-level = 3

[profile.release.package.ego-tree]
opt-level = 3

[profile.release.package.pulldown-cmark]
opt-level = 3

[profile.release.package.encoding_rs]
opt-level = 3

[profile.release.package.chardetng]
opt-level = 3

[profile.release.package.miniz_oxide]
opt-level = 3

[profile.release.package.flate2]
opt-level = 3

[profile.release.package.zip]
opt-level = 3

[profile.release.package.hayro]
opt-level = 3

[profile.release.package.hayro-interpret]
opt-level = 3

[profile.release.package.hayro-syntax]
opt-level = 3

[profile.release.package.hayro-cmap]
opt-level = 3

[profile.release.package.kurbo]
opt-level = 3

[profile.release.package.rtf-parser]
opt-level = 3

[profile.release.package.unicode-bidi]
opt-level = 3

[profile.release.package.icu_normalizer]
opt-level = 3

[profile.release.package.icu_properties]
opt-level = 3

[profile.release.package.libchm]
opt-level = 3

[profile.release.package.libhlp]
opt-level = 3

[profile.release.package.cfb]
opt-level = 3
