name: CI
on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
jobs:
  fmt:
    name: Format check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: nightly
          components: rustfmt
      - name: Check formatting
        run: cargo +nightly fmt --check
  test:
    name: Tests
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
          fetch-depth: 0
      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
      - name: Install CMake, Ninja, and Pandoc
        run: choco install cmake ninja pandoc -y
      - name: Install WebView2 SDK
        run: |
          nuget install Microsoft.Web.WebView2 -OutputDirectory packages
          $pkg = Get-ChildItem "packages" -Filter "Microsoft.Web.WebView2.*" -Directory | Select-Object -First 1
          $libPath = Join-Path $pkg.FullName "build\native\x64"
          echo "LIB=$env:LIB;$libPath" >> $env:GITHUB_ENV
      - name: Install Gettext via MSYS2
        id: msys2
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            gettext
            mingw-w64-ucrt-x86_64-gettext-tools
      # setup-msys2 leaves msgfmt off the PATH of later steps, so the build scripts silently
      # skip every .po file unless the MSYS2 bin directories are added here.
      - name: Add Gettext to PATH
        run: |
          echo "${{ steps.msys2.outputs.msys2-location }}\ucrt64\bin" >> $env:GITHUB_PATH
          echo "${{ steps.msys2.outputs.msys2-location }}\usr\bin" >> $env:GITHUB_PATH
      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
      - name: Run tests
        run: cargo test --workspace
  clippy:
    name: Clippy
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
          fetch-depth: 0
      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          components: clippy
      - name: Install CMake, Ninja, and Pandoc
        run: choco install cmake ninja pandoc -y
      - name: Install WebView2 SDK
        run: |
          nuget install Microsoft.Web.WebView2 -OutputDirectory packages
          $pkg = Get-ChildItem "packages" -Filter "Microsoft.Web.WebView2.*" -Directory | Select-Object -First 1
          $libPath = Join-Path $pkg.FullName "build\native\x64"
          echo "LIB=$env:LIB;$libPath" >> $env:GITHUB_ENV
      - name: Install Gettext via MSYS2
        id: msys2
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            gettext
            mingw-w64-ucrt-x86_64-gettext-tools
      # setup-msys2 leaves msgfmt off the PATH of later steps, so the build scripts silently
      # skip every .po file unless the MSYS2 bin directories are added here.
      - name: Add Gettext to PATH
        run: |
          echo "${{ steps.msys2.outputs.msys2-location }}\ucrt64\bin" >> $env:GITHUB_PATH
          echo "${{ steps.msys2.outputs.msys2-location }}\usr\bin" >> $env:GITHUB_PATH
      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
      # `clippy::all` is denied through [workspace.lints] in Cargo.toml, so this fails the job on
      # any of those lints. The pedantic and nursery groups stay warnings and are printed, not
      # enforced -- see the comment on the lint table for why.
      - name: Run clippy
        run: cargo clippy --workspace --all-targets --release
