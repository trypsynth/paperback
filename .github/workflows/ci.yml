name: CI
on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
jobs:
  fmt:
    name: Format check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: nightly
          components: rustfmt
      - name: Check formatting
        run: cargo +nightly fmt --check
  android:
    name: Android checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          java-version: '25'
          distribution: 'temurin'
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
      # The unit tests run on the host JVM and never call into the native library, but the code
      # they cover is compiled against the uniffi types, so the bindings have to exist for the
      # app module to compile at all. Generating them is a host build of paperback-core alone:
      # no NDK or cargo-ndk, and none of the pdfium, translation, or pandoc assets that the APK
      # build in build.yml needs on top. ktlint skips the generated file either way.
      # The interface lives in the Rust now rather than in a .udl, so uniffi reads it from the
      # compiled library's own metadata. That means building the library first.
      - name: Generate Kotlin bindings
        run: |
          cargo build -p paperback-core --features uniffi --lib --release
          LIB=$(ls target/release/libpaperback_core.so target/release/libpaperback_core.dylib target/release/paperback_core.dll 2>/dev/null | head -1)
          cargo run -p paperback-core --features uniffi --bin uniffi-bindgen --             generate --library "$LIB"             --language kotlin --out-dir android/app/src/main/kotlin --no-format
      - name: Cache Gradle packages
        uses: actions/cache@v6
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('android/**/*.gradle.kts', 'android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-
      - name: Check formatting and run unit tests
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew ktlintCheck testDebugUnitTest
      - name: Upload test report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: android-test-report
          path: android/app/build/reports/tests/
          retention-days: 7

  android-instrumented:
    name: Android instrumented tests
    # Split from the unit test job because booting an emulator costs minutes that the rest of
    # the Android checks should not wait on.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Set up JDK
        uses: actions/setup-java@v6
        with:
          java-version: '25'
          distribution: 'temurin'
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
      # Same reasoning as the unit test job: the app module only compiles once the uniffi types
      # exist, and generating them is a host build of paperback-core with no NDK involved.
      # The interface lives in the Rust now rather than in a .udl, so uniffi reads it from the
      # compiled library's own metadata. That means building the library first.
      - name: Generate Kotlin bindings
        run: |
          cargo build -p paperback-core --features uniffi --lib --release
          LIB=$(ls target/release/libpaperback_core.so target/release/libpaperback_core.dylib target/release/paperback_core.dll 2>/dev/null | head -1)
          cargo run -p paperback-core --features uniffi --bin uniffi-bindgen --             generate --library "$LIB"             --language kotlin --out-dir android/app/src/main/kotlin --no-format
      - name: Cache Gradle packages
        uses: actions/cache@v6
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('android/**/*.gradle.kts', 'android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-
      - name: Enable KVM for the emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      # The reading bar's semantics are what TalkBack reads out, and they only exist once the
      # bar is composed, so this is the only place that behaviour can be checked automatically.
      - name: Run instrumented tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          disable-animations: true
          script: cd android && chmod +x gradlew && ./gradlew connectedDebugAndroidTest
      - name: Upload instrumented test report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: android-instrumented-report
          path: android/app/build/reports/androidTests/
          retention-days: 7
  ios:
    name: iOS checks
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          targets: aarch64-apple-ios,aarch64-apple-ios-sim
      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
      # The XCFramework and the Swift bindings both have to exist before xcodebuild runs: the
      # app imports the generated paperback.swift, and the project links the framework. This is
      # the same task the release build uses, so a break in either shows up here.
      - name: Build the XCFramework and Swift bindings
        run: cargo xtask ios --release
      # No signing: CI has no certificate, and an unsigned build still compiles and links every
      # Swift file, which is what this job is for. Producing an .ipa needs the release flow.
      - name: Build the app
        run: >
          xcodebuild -project ios/Paperback.xcodeproj -scheme Paperback
          -configuration Release -destination 'generic/platform=iOS'
          CODE_SIGNING_ALLOWED=NO build
      # The unit tests are hosted by the app, so they need a simulator to run in. Picking the
      # first available iPhone by udid rather than naming a model keeps this working when the
      # runner image changes which devices it ships.
      - name: Run the unit tests
        run: |
          UDID=$(xcrun simctl list devices available -j | python3 -c "import json,sys; d=json.load(sys.stdin)['devices']; print(next(x['udid'] for rt in d for x in d[rt] if 'iPhone' in x['name']))")
          echo "Testing on simulator $UDID"
          xcodebuild -project ios/Paperback.xcodeproj -scheme Paperback             -destination "id=$UDID" CODE_SIGNING_ALLOWED=NO test

  test:
    name: Tests
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
          fetch-depth: 0
      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
      - name: Install CMake, Ninja, and Pandoc
        run: choco install cmake ninja pandoc -y
      - name: Install WebView2 SDK
        run: |
          nuget install Microsoft.Web.WebView2 -OutputDirectory packages
          $pkg = Get-ChildItem "packages" -Filter "Microsoft.Web.WebView2.*" -Directory | Select-Object -First 1
          $libPath = Join-Path $pkg.FullName "build\native\x64"
          echo "LIB=$env:LIB;$libPath" >> $env:GITHUB_ENV
      - name: Install Gettext via MSYS2
        id: msys2
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            gettext
            mingw-w64-ucrt-x86_64-gettext-tools
      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
      # msgfmt comes from MSYS2, which setup-msys2 leaves off this step's PATH, so the build
      # scripts would silently skip every .po file. Appended rather than prepended: MSYS2's
      # usr/bin has a coreutils link.exe that would otherwise shadow the MSVC linker.
      - name: Run tests
        run: |
          $env:PATH = "$env:PATH;${{ steps.msys2.outputs.msys2-location }}\ucrt64\bin;${{ steps.msys2.outputs.msys2-location }}\usr\bin"
          cargo test --workspace
  test-macos:
    name: Tests (macOS)
    runs-on: macos-latest
    env:
      WXWIDGETS_DIR: ${{ github.workspace }}/wxWidgets
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
          fetch-depth: 0
      - name: Install CMake, Ninja, Pandoc, and Gettext
        run: |
          brew install cmake ninja pandoc gettext
          echo "/opt/homebrew/opt/gettext/bin" >> "$GITHUB_PATH"
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          components: clippy
      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
      - name: Cache wxWidgets source
        id: wxwidgets-cache
        uses: actions/cache@v6
        with:
          path: wxWidgets
          key: wxwidgets-${{ runner.os }}-${{ runner.arch }}-v1
      - name: Clone wxWidgets
        if: steps.wxwidgets-cache.outputs.cache-hit != 'true'
        run: git clone --recurse-submodules https://github.com/wxWidgets/wxWidgets.git
      - name: Run tests
        run: cargo test --workspace
      # The default profile shares the wxWidgets build with the workspace tests.
      - name: Run clippy
        run: cargo clippy --workspace --all-targets
  clippy:
    name: Clippy
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
          fetch-depth: 0
      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          components: clippy
      - name: Install CMake, Ninja, and Pandoc
        run: choco install cmake ninja pandoc -y
      - name: Install WebView2 SDK
        run: |
          nuget install Microsoft.Web.WebView2 -OutputDirectory packages
          $pkg = Get-ChildItem "packages" -Filter "Microsoft.Web.WebView2.*" -Directory | Select-Object -First 1
          $libPath = Join-Path $pkg.FullName "build\native\x64"
          echo "LIB=$env:LIB;$libPath" >> $env:GITHUB_ENV
      - name: Install Gettext via MSYS2
        id: msys2
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            gettext
            mingw-w64-ucrt-x86_64-gettext-tools
      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
      # `clippy::all` is denied through [workspace.lints] in Cargo.toml, so this fails the job on
      # any of those lints. The pedantic and nursery groups stay warnings and are printed, not
      # enforced -- see the comment on the lint table for why.
      # msgfmt comes from MSYS2, which setup-msys2 leaves off this step's PATH, so the build
      # scripts would silently skip every .po file. Appended rather than prepended: MSYS2's
      # usr/bin has a coreutils link.exe that would otherwise shadow the MSVC linker.
      - name: Run clippy
        run: |
          $env:PATH = "$env:PATH;${{ steps.msys2.outputs.msys2-location }}\ucrt64\bin;${{ steps.msys2.outputs.msys2-location }}\usr\bin"
          cargo clippy --workspace --all-targets --release
