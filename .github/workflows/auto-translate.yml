name: Auto-translate strings
on:
  push:
    branches:
      - master
    paths:
      - 'crates/**/*.rs'
      # Dependencies tagged translatable (ship-shape, wx-utils) contribute strings to
      # paperback.pot too, so a version bump can add strings without touching any .rs
      # file here. The lockfile moves for both a manifest bump and a plain cargo update.
      - 'Cargo.lock'
      - 'android/app/src/main/kotlin/**/*.kt'
      - 'ios/Paperback/**/*.swift'
      - 'po/**/*.po'
      - 'doc/readme.md'
  workflow_dispatch:
permissions:
  contents: write
  pull-requests: write
jobs:
  translate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2
      - name: Install gettext and pandoc
        run: sudo apt-get update && sudo apt-get install -y gettext pandoc
      - name: Translate
        # DeepL quota exhaustion (HTTP 456) shouldn't turn every push red; untranslated
        # entries are simply retried on the next run once quota resets.
        continue-on-error: true
        env:
          DEEPL_API_KEY: ${{ secrets.DEEPL_API_KEY }}
        run: cargo run -p xtask --release -- translate
      - name: Open or update translation PR
        uses: peter-evans/create-pull-request@v8
        with:
          add-paths: |
            po/
            doc/
          commit-message: "chore: machine-translate missing strings via DeepL"
          committer: github-actions[bot] <github-actions[bot]@users.noreply.github.com>
          author: github-actions[bot] <github-actions[bot]@users.noreply.github.com>
          branch: auto-translate-strings
          delete-branch: true
          title: "chore: machine-translate missing strings via DeepL"
          body: Automated DeepL translation update. Runs on every push to master; safe to leave open and merge periodically.
