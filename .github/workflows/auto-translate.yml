name: Auto-translate strings
on:
  push:
    branches:
      - master
    paths:
      - 'crates/**/*.rs'
      # Dependencies tagged translatable (ship-shape, wx-utils) contribute strings to
      # paperback.pot too, so a version bump can add strings without touching any .rs
      # file here. The lockfile moves for both a manifest bump and a plain cargo update.
      - 'Cargo.lock'
      - 'android/app/src/main/kotlin/**/*.kt'
      - 'ios/Paperback/**/*.swift'
      - 'po/**/*.po'
      - 'doc/readme.md'
  workflow_dispatch:
    inputs:
      repair_copies:
        # A one-off, not a switch to leave on: see `add_copied_entries` in xtask's translate.rs.
        description: Re-translate machine translations that share their text with a different string
        type: boolean
        default: false
permissions:
  contents: write
  pull-requests: write
jobs:
  translate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2
      # pandoc is still needed by the build and the android/ios tasks; the translate task
      # itself no longer converts the readme through HTML.
      - name: Install gettext and pandoc
        run: sudo apt-get update && sudo apt-get install -y gettext pandoc
      - name: Translate
        # A rate limit or an outage shouldn't turn every push red; entries that didn't get
        # translated, and any that failed a placeholder/accelerator check, are simply retried
        # on the next run.
        continue-on-error: true
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        # --repair also re-translates entries whose existing translation provably dropped a
        # placeholder, an accelerator or a shortcut suffix. Self-limiting: once an entry passes
        # the checks it stops being flagged, so this only ever costs anything while there is
        # real damage to undo.
        run: |
          set -o pipefail
          cargo run -p xtask --release -- translate --repair ${{ inputs.repair_copies && '--repair-copies' || '' }} 2>&1 | tee "$RUNNER_TEMP/translate.log"
      # `continue-on-error` above hides a real failure as well as a rate limit, and a manual that
      # keeps coming back missing sections is not something to find out about by reading logs.
      # Whatever the run could not write is put on the run summary and into the pull request.
      - name: Report anything that did not translate
        id: trouble
        if: always()
        run: |
          log="$RUNNER_TEMP/translate.log"
          if [ -f "$log" ] && grep -q 'came back incomplete' "$log"; then
            {
              echo "### The manual came back incomplete"
              echo
              echo '```'
              grep -E 'came back incomplete|not written' "$log"
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            {
              echo "note<<EOF"
              echo
              echo "**Some manuals were not written this run.** Their sections came back from the"
              echo "model missing headings or list items, so nothing was written for them rather"
              echo "than committing a short file."
              echo
              echo '```'
              grep -E 'came back incomplete|not written' "$log"
              echo '```'
              echo "EOF"
            } >> "$GITHUB_OUTPUT"
          fi
      - name: Open or update translation PR
        uses: peter-evans/create-pull-request@v8
        with:
          add-paths: |
            po/
            doc/
          commit-message: "chore: machine-translate missing strings"
          committer: github-actions[bot] <github-actions[bot]@users.noreply.github.com>
          author: github-actions[bot] <github-actions[bot]@users.noreply.github.com>
          branch: auto-translate-strings
          delete-branch: true
          title: "chore: machine-translate missing strings"
          body: |
            Automated translation update. Runs on every push to master; safe to leave open and merge periodically.
            ${{ steps.trouble.outputs.note }}
