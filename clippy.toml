# wx dialog wiring passes a widget per parameter, and the PDF structure walker threads several
# accumulators through one recursive call; clippy's default of 7 is too tight for both. Anything
# past 10 should be bundled into a struct rather than allowed here.
too-many-arguments-threshold = 10

# Product and format names that read as prose, not as code items. Without this every mention has to be wrapped in backticks and then renders as inline code in the docs.
doc-valid-idents = ["WinHelp", "PowerPoint", "WordPad", "FictionBook", "FictionBooks", "FBReader", "DTBook", "MathML", "MathCAT", "PalmDOC", "ID3v2", "AppImage", "AppImages", "VoiceOver", "OpenSolaris", ".."]
